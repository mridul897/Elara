<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your screen: &lt;client name&gt;</title>
  <!--
    TEMPLATE. Rename this to something real (my-booking-screen.html,
    my-checkout.html) before you build, then delete this comment.

    You do not write this file by hand. Claude Code writes it:

      1. /brief-to-tasks on your interrogated brief
      2. /frontend-design on the ONE task that builds this screen

    Ask for one screen. Ask for the whole product and you get the whole
    product, badly.

    Before you run it, these three should exist in this folder, because
    Claude Code reads them and cannot guess what is not written down:
      context.md            who is on the other end of this screen
      brief-interrogated.md what you actually decided
      tokens.md             the named values it should use

    Then the loop: open it in a browser at the width your users are on,
    find ONE specific thing wrong, name it with a number or a token name,
    tell Claude Code to fix that one thing, refresh. Twice minimum.
  -->
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid; place-items: center; min-height: 100vh; margin: 0;
      padding: 24px; text-align: center; line-height: 1.6;
    }
    p { max-width: 34ch; opacity: 0.75; }
    code { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; }
  </style>
</head>
<body>
  <main>
    <h1>Nothing here yet</h1>
    <p>This is the empty template. Rename it, then let Claude Code build into it with <code>/brief-to-tasks</code> and <code>/frontend-design</code>.</p>
  </main>
</body>
</html>
