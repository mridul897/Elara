<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Customers · ELARA Admin</title>
<link rel="icon" href="favicon1.png">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="admin.css">
<style>
  .cols { display: flex; gap: 20px; align-items: flex-start; }
  .cols > .table { flex: 2 1 0; min-width: 0; }
  .trow.crow { padding: 9px 16px; }
  .trow.crow.sel { background: #f6f8fe; }
  .cname { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .cname .avatar { background: #e3e6ef; }
  .cname span { font-size: 13px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-ph { width: 160px; } .c-or { width: 60px; } .c-sp { width: 110px; } .c-la { width: 90px; }
  .detail { width: 340px; flex: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; }
  .detail .h { display: flex; gap: 12px; align-items: center; }
  .detail .h .avatar { width: 44px; height: 44px; font-size: 17.6px; }
  .detail .h .n { font-size: 15px; font-weight: 600; }
  .detail .h .s { font-size: 12px; color: var(--mute); margin-top: 2px; }
  .detail hr { border: 0; height: 1px; background: var(--border); margin: 0; width: 100%; }
  .kv { display: flex; flex-direction: column; gap: 2px; }
  .kv .k { font-size: 12px; color: var(--mute); } .kv .v { font-size: 13px; }
  .detail .ro { display: flex; gap: 8px; align-items: center; font-size: 13px; color: inherit; }
  .detail .ro b { flex: 1; font-weight: 500; }
  .detail .ro span:nth-child(2) { color: var(--sub); }
  .btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  @media (max-width: 1100px) { .cols { flex-direction: column; } .detail { width: 100%; position: static; } }

  @media (max-width: 899.98px) { .c-ph, .c-la { display: none; } .c-or { width: 40px; } .c-sp { width: auto; } .trow.crow { flex-wrap: nowrap; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="icons.js"></script>
<script src="admin.js"></script>
<script>
A.boot({
  active: 'customers',
  crumbs: [{ t: 'Customers' }],
  render: async function (page, ctx) {
    var $ = function (id) { return document.getElementById(id); };
    var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var state = { q: '', repeat: false, zone: 'all', sel: null, page: 0, rows: [] };
    var PAGE = 10;
    var ZONES = [{ v: 'all', l: 'All areas' }, { v: 'Dhaka', l: 'Dhaka' }, { v: 'Outside Dhaka', l: 'Outside Dhaka' }];
    var dShort = function (iso) { var d = new Date(iso); return d.getDate() + ' ' + MON[d.getMonth()]; };
    var phone = function (p) { var d = String(p).replace(/[^0-9]/g, ''); return d.length === 13 && d.indexOf('880') === 0 ? '+880 ' + d.slice(3, 7) + ' ' + d.slice(7, 10) + ' ' + d.slice(10) : p; };

    page.innerHTML =
      '<div class="page-head"><div class="t"><h1 class="h1">Customers</h1><p class="sub" id="sub">Loading…</p></div><button class="btn" id="export">' + A.ic('file-download', 16) + 'Export CSV</button></div>' +
      '<div class="toolbar"><label class="field-search">' + A.ic('magnifying-glass', 16) + '<input id="q" placeholder="Search name or phone" aria-label="Search customers"></label>' +
      '<button class="btn" id="repeat">' + A.ic('filter1', 16) + 'Repeat customers</button>' +
      '<div class="pop-wrap" id="zoneWrap"><button class="btn" id="zoneBtn"><span id="zoneTxt">Dhaka</span>' + A.ic('chevron-down-small', 16) + '</button></div></div>' +
      '<div class="cols"><div class="table" id="table"></div><aside class="detail" id="detail"></aside></div>' +
      '<div class="pager"><p class="info" id="info"></p><button class="btn sm" id="prev">Previous</button><button class="btn sm" id="next">Next</button></div>';
    $('table').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

    var res = await A.sb.from('orders').select('id,placed_at,customer_phone,customer_name,email,division,district,upazila,address,zone,total,status,payment_state').order('placed_at', { ascending: false }).limit(5000);
    if (res.error) { $('table').innerHTML = '<div class="empty"><b>Could not load customers</b>' + A.esc(res.error.message) + '</div>'; $('sub').textContent = ''; return; }
    var by = {};
    res.data.forEach(function (o) {
      var c = by[o.customer_phone] = by[o.customer_phone] || { phone: o.customer_phone, name: o.customer_name, email: o.email, orders: [], spent: 0, first: o.placed_at, last: o.placed_at, zone: o.zone, address: null };
      c.orders.push(o);
      if (o.status !== 'cancelled' && o.status !== 'returned' && o.payment_state !== 'failed' && o.payment_state !== 'refunded') c.spent += o.total;
      if (o.placed_at < c.first) c.first = o.placed_at;
      if (o.placed_at > c.last) { c.last = o.placed_at; c.name = o.customer_name; c.zone = o.zone; }
      if (!c.email && o.email) c.email = o.email;
    });
    var all = Object.keys(by).map(function (k) { var c = by[k], l = c.orders[0]; c.address = [l.address, l.upazila, l.district].filter(Boolean).join(', '); return c; });
    all.sort(function (a, b) { return b.last < a.last ? -1 : 1; });
    state.rows = all; state.sel = all[0] ? all[0].phone : null;

    function list() {
      var q = state.q.trim().toLowerCase();
      return state.rows.filter(function (c) {
        if (state.repeat && c.orders.length < 2) return false;
        if (state.zone !== 'all' && c.zone !== state.zone) return false;
        if (q && (c.name + ' ' + c.phone).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
    }
    function draw() {
      var l = list(), pages = Math.max(1, Math.ceil(l.length / PAGE));
      if (state.page >= pages) state.page = pages - 1;
      var slice = l.slice(state.page * PAGE, state.page * PAGE + PAGE);
      var repeatN = state.rows.filter(function (c) { return c.orders.length > 1; }).length;
      $('sub').textContent = state.rows.length + ' customer' + (state.rows.length === 1 ? '' : 's') + ' · ' + repeatN + ' ordered more than once';
      $('repeat').classList.toggle('on', state.repeat);
      $('zoneTxt').textContent = state.zone === 'all' ? 'All areas' : state.zone;
      var head = '<div class="trow head"><span class="grow">Customer</span><span class="c c-ph">Phone</span><span class="c c-or">Orders</span><span class="c c-sp">Spent</span><span class="c c-la">Last order</span></div>';
      $('table').innerHTML = head + (slice.length ? slice.map(function (c) {
        return '<div class="trow crow link' + (state.sel === c.phone ? ' sel' : '') + '" data-ph="' + A.esc(c.phone) + '"><div class="cname"><span class="avatar">' + A.esc(A.initials(c.name)) + '</span><span>' + A.esc(c.name) + '</span></div>' +
          '<span class="c c-ph">' + A.esc(phone(c.phone)) + '</span><span class="c c-or strong">' + c.orders.length + '</span><span class="c c-sp">' + A.money(c.spent) + '</span><span class="c c-la">' + dShort(c.last) + '</span></div>';
      }).join('') : '<div class="empty"><b>' + (state.rows.length ? 'No customers match' : 'No customers yet') + '</b>' + (state.rows.length ? 'Try a different search or filter.' : 'Customers appear here after their first order.') + '</div>');
      var from = l.length ? state.page * PAGE + 1 : 0;
      $('info').textContent = 'Showing ' + from + ' to ' + Math.min(l.length, state.page * PAGE + PAGE) + ' of ' + l.length + ' customer' + (l.length === 1 ? '' : 's');
      $('prev').disabled = state.page === 0; $('next').disabled = state.page >= pages - 1;
      var c = by[state.sel];
      $('detail').hidden = !c;
      if (c) {
        var since = new Date(c.first);
        $('detail').innerHTML = '<div class="h"><span class="avatar">' + A.esc(A.initials(c.name)) + '</span><div><p class="n">' + A.esc(c.name) + '</p><p class="s">Customer since ' + MON[since.getMonth()] + ' ' + since.getFullYear() + '</p></div></div><hr>' +
          '<div class="kv"><span class="k">Phone</span><span class="v">' + A.esc(phone(c.phone)) + '</span></div>' +
          '<div class="kv"><span class="k">Email</span><span class="v">' + A.esc(c.email || 'Not given') + '</span></div>' +
          '<div class="kv"><span class="k">Default address</span><span class="v">' + A.esc(c.address || 'Not given') + '</span></div>' +
          '<div class="kv"><span class="k">Lifetime spend</span><span class="v">' + A.money(c.spent) + ' across ' + c.orders.length + ' order' + (c.orders.length === 1 ? '' : 's') + '</span></div><hr>' +
          '<p style="font-size:13px;font-weight:500">Recent orders</p>' +
          c.orders.slice(0, 3).map(function (o) { var b = A.statusBadge(o); return '<a class="ro" href="order.html?id=' + encodeURIComponent(o.id) + '"><b>' + A.esc(o.id) + '</b><span>' + A.money(o.total) + '</span><span class="badge ' + b.cls + '">' + b.label + '</span></a>'; }).join('');
      }
    }
    var tm; $('q').addEventListener('input', function (e) { clearTimeout(tm); tm = setTimeout(function () { state.q = e.target.value; state.page = 0; draw(); }, 120); });
    $('repeat').addEventListener('click', function () { state.repeat = !state.repeat; state.page = 0; draw(); });
    $('zoneBtn').addEventListener('click', function (e) { e.stopPropagation(); A.menu($('zoneWrap'), ZONES, state.zone, function (v) { state.zone = v; state.page = 0; draw(); }); });
    $('prev').addEventListener('click', function () { state.page--; draw(); });
    $('next').addEventListener('click', function () { state.page++; draw(); });
    $('table').addEventListener('click', function (e) { var r = e.target.closest('[data-ph]'); if (!r) return; state.sel = r.getAttribute('data-ph'); draw(); });
    $('export').addEventListener('click', function () {
      var l = list(); if (!l.length) { A.toast('Nothing to export.', true); return; }
      var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
      var csv = ['Name,Phone,Email,Orders,Spent,Last order,Area'].concat(l.map(function (c) { return [c.name, c.phone, c.email, c.orders.length, c.spent, c.last.slice(0, 10), c.zone].map(q).join(','); })).join('\r\n');
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'elara-customers-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click(); URL.revokeObjectURL(a.href);
    });
    draw();
  }
});
</script>
</body>
</html>
