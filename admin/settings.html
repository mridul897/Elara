<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Settings · ELARA Admin</title>
<link rel="icon" href="favicon1.png">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="admin.css">
<style>
  .cols { display: flex; gap: 20px; align-items: flex-start; }
  .left { flex: 2 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .right { width: 340px; flex: none; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 12px; }
  .card h3 { font-size: 15px; font-weight: 600; }
  .f { display: flex; flex-direction: column; gap: 6px; } .f > label { font-size: 13px; font-weight: 500; }
  .two { display: flex; gap: 12px; } .two > * { flex: 1; min-width: 0; }
  .list { display: flex; flex-direction: column; }
  .li { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
  .li .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .li .n { font-size: 13px; font-weight: 500; } .li .s { font-size: 12px; color: var(--mute); }
  .li .s button { background: none; border: 0; padding: 0; font: inherit; color: var(--mute); text-decoration: underline; text-decoration-style: dotted; }
  .li .avatar { background: #e3e6ef; }
  .head2 { display: flex; align-items: center; padding-bottom: 10px; } .head2 h3 { flex: 1; }
  .tog { width: 36px; height: 20px; border-radius: 10px; border: 0; padding: 0; background: #d5d8de; position: relative; transition: background .15s; flex: none; }
  .tog::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .tog[aria-checked="true"] { background: var(--accent); } .tog[aria-checked="true"]::after { left: 18px; }
  .tog[disabled] { opacity: .5; }
  .nrow { display: flex; gap: 10px; align-items: center; } .nrow .t { flex: 1; display: flex; flex-direction: column; gap: 1px; } .nrow .n { font-size: 13px; font-weight: 500; } .nrow .s { font-size: 12px; color: var(--mute); }
  .act { font-size: 12px; line-height: 18px; color: var(--sub); }
  .note { font-size: 12px; color: var(--mute); }
  .tabs a.tab { text-decoration: none; }
  .btn.block { width: 100%; height: 34px; }
  @media (max-width: 1100px) { .cols { flex-direction: column; } .right { width: 100%; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="icons.js"></script>
<script src="admin.js"></script>
<script>
A.boot({
  active: 'settings',
  crumbs: [{ t: 'Settings' }],
  render: async function (page, ctx) {
    var $ = function (id) { return document.getElementById(id); };
    var S = {
      store: { name: 'ELARA', currency: 'BDT', timezone: 'Asia/Dhaka' },
      payments: { cod: { on: true }, bkash: { on: true, number: '' }, nagad: { on: true, number: '' }, card: { on: false } },
      notifications: { new_order: true, low_stock: true, payment_failed: true, new_review: false },
      analytics: { ga_id: '', fb_pixel: '' },
      inventory: { low: 5 }
    };
    var owner = ctx.role === 'owner', dirty = false;
    var res = await A.sb.from('settings').select('key,value');
    (res.data || []).forEach(function (r) { if (S[r.key]) { S[r.key] = JSON.parse(JSON.stringify(Object.assign({}, S[r.key], r.value))); if (r.key === 'payments') ['cod', 'bkash', 'nagad', 'card'].forEach(function (k) { S.payments[k] = Object.assign({}, { on: false }, r.value[k] || {}); }); } });
    var team = (await A.sb.from('profiles').select('id,full_name,email,role,created_at').order('created_at')).data || [];
    var log = owner ? ((await A.sb.from('activity_log').select('*').order('at', { ascending: false }).limit(12)).data || []) : [];

    function mark() { dirty = true; }
    var PAYROWS = [['cod', 'Cash on delivery', 'No setup needed', ['Live', 'b-ok']], ['bkash', 'bKash', null, ['Test mode', 'b-warn']], ['nagad', 'Nagad', null, ['Test mode', 'b-warn']], ['card', 'Card (Visa, Mastercard)', 'Needs a card gateway account', ['Not connected', 'b-mute']]];
    var NOTIFS = [['new_order', 'New order'], ['low_stock', 'Low stock'], ['payment_failed', 'Payment failed'], ['new_review', 'New review']];
    var toggle = function (id, on, off) { return '<button class="tog" role="switch" id="' + id + '" aria-checked="' + !!on + '"' + (owner && !off ? '' : ' disabled') + ' aria-label="' + id + '"></button>'; };

    function activityLine(a) {
      var who = a.actor_name || 'Someone', when = A.ago(a.at), d = a.detail || {}, n = d.after && (d.after.name || d.after.id || d.after.code) || a.entity_id;
      if (a.entity === 'products') {
        if (a.action === 'update' && d.before && d.after && d.before.price !== d.after.price) return who + ' changed the price of ' + n + ' · ' + when;
        if (a.action === 'update') return who + ' updated ' + n + ' · ' + when;
        return who + ' ' + (a.action === 'insert' ? 'added' : 'removed') + ' a product · ' + when;
      }
      if (a.entity === 'orders') return who + ' updated order ' + a.entity_id + ' · ' + when;
      if (a.entity === 'promo_codes') return who + ' ' + (a.action === 'insert' ? 'created' : a.action === 'delete' ? 'deleted' : 'changed') + ' promo ' + a.entity_id + ' · ' + when;
      if (a.entity === 'reviews') return who + ' moderated a review · ' + when;
      return who + ' changed ' + a.entity + ' · ' + when;
    }

    function draw() {
      var tabs = [['general', 'General'], ['payments', 'Payments'], ['delivery', 'Delivery'], ['team', 'Team'], ['notifications', 'Notifications']];
      page.innerHTML =
        '<div class="page-head keep"><div class="t"><h1 style="font-size:22px;font-weight:600;letter-spacing:-0.4px">Settings</h1><p class="sub">Store, payments and who can sign in</p></div>' +
        (owner ? '<button class="btn primary" id="save">Save settings</button>' : '') + '</div>' +
        '<div class="tabs" id="tabs">' + tabs.map(function (t, i) { return '<a class="tab' + (i === 0 ? ' on' : '') + '" href="#' + t[0] + '" data-tab="' + t[0] + '"><span class="l">' + t[1] + '</span><span class="bar"></span></a>'; }).join('') + '</div>' +
        '<div class="cols"><div class="left">' +
        '<section class="card" id="general"><h3>Store</h3><div class="f"><label for="sName">Store name</label><input class="text" id="sName" value="' + A.esc(S.store.name) + '"' + (owner ? '' : ' disabled') + '></div>' +
        '<div class="two"><div class="f"><label for="sCur">Currency</label><select class="select" id="sCur"><option value="BDT" selected>BDT · Tk.</option></select></div>' +
        '<div class="f"><label for="sTz">Time zone</label><select class="select" id="sTz"><option value="Asia/Dhaka" selected>Asia/Dhaka</option></select></div></div>' +
        '<div class="f"><label for="sLow">Low stock alert</label><div style="display:flex;align-items:center;gap:8px"><input class="text" id="sLow" type="number" min="0" max="999" value="' + (+S.inventory.low || 5) + '" style="max-width:110px"><span class="note">Warn me when a bag has this many left or fewer.</span></div></div></section>' +
        '<section class="card" id="payments" style="gap:0"><h3 style="margin-bottom:10px">Payment methods</h3><div class="list">' + PAYROWS.map(function (p) {
          var sub = p[0] === 'bkash' || p[0] === 'nagad' ? '<button data-num="' + p[0] + '"' + (owner ? '' : ' disabled') + '>' + (S.payments[p[0]].number ? 'Merchant number ' + A.esc(S.payments[p[0]].number) : 'Add merchant number') + '</button>' : p[2];
          return '<div class="li"><div class="t"><span class="n">' + p[1] + '</span><span class="s">' + sub + '</span></div><span class="badge ' + p[3][1] + '">' + p[3][0] + '</span>' + toggle('pay_' + p[0], S.payments[p[0]].on, p[0] === 'card') + '</div>';
        }).join('') + '</div><p class="note" style="margin-top:10px">bKash, Nagad and card run in test mode until a merchant account is connected. Customers can still choose them; confirm each payment on the order.</p></section>' +
        '<section class="card" id="delivery"><div class="head2" style="padding:0"><h3>Delivery</h3><a class="btn sm" href="promotions.html">Edit delivery rules</a></div><p class="note">Charges, delivery days and the free-delivery limit are managed under Promotions.</p></section>' +
        '<section class="card" id="team" style="gap:0"><div class="head2"><h3>Team</h3><button class="btn sm" id="invite"' + (owner ? '' : ' disabled') + '>' + A.ic('plus-small', 16) + 'Invite someone</button></div><div class="list" id="teamList"></div></section>' +
        '</div><div class="right">' +
        '<section class="card" id="notifications"><h3>Notifications</h3>' + NOTIFS.map(function (n) {
          return '<div class="nrow"><div class="t"><span class="n">' + n[1] + '</span><span class="s" id="ns_' + n[0] + '">' + (S.notifications[n[0]] ? 'Email me' : 'Off') + '</span></div>' + toggle('nt_' + n[0], S.notifications[n[0]]) + '</div>';
        }).join('') + '<p class="note">Your choices are saved. Email sending is switched on once the store has its own email service.</p></section>' +
        '<section class="card" id="analytics"><h3>Analytics</h3><p class="note">Paste your IDs to measure visits and Facebook ads. Nothing is loaded until you add one.</p>' +
        '<div class="f"><label for="gaId">Google Analytics ID</label><input class="text" id="gaId" placeholder="G-XXXXXXXXXX" value="' + A.esc(S.analytics.ga_id || '') + '"' + (owner ? '' : ' disabled') + '></div>' +
        '<div class="f"><label for="fbId">Facebook Pixel ID</label><input class="text" id="fbId" inputmode="numeric" placeholder="1234567890123456" value="' + A.esc(S.analytics.fb_pixel || '') + '"' + (owner ? '' : ' disabled') + '></div></section>' +
        '<section class="card"><h3>Your account</h3><div class="f"><label>Email</label><input class="text" value="' + A.esc(ctx.user.email) + '" disabled></div>' +
        '<button class="btn block" id="chpw">Change password</button><button class="btn block" id="soAll">Sign out everywhere</button></section>' +
        (owner ? '<section class="card" style="gap:8px"><h3>Recent activity</h3><a href="activity.html" style="font-size:13px;color:var(--accent);font-weight:500">View all activity and problems</a>' + (log.length ? log.slice(0, 5).map(function (a) { return '<p class="act">' + A.esc(activityLine(a)) + '</p>'; }).join('') : '<p class="act">Nothing yet. Changes your team makes show up here.</p>') + '</section>' : '') +
        '</div></div>';
      drawTeam(); wire();
    }

    function drawTeam() {
      $('teamList').innerHTML = team.length ? team.map(function (m) {
        var me = m.id === ctx.user.id;
        return '<div class="li"><span class="avatar">' + A.esc(A.initials(m.full_name || m.email)) + '</span><div class="t"><span class="n">' + A.esc(m.full_name || m.email || 'Team member') + (me ? ' (you)' : '') + '</span><span class="s">' + A.esc(m.email || '') + '</span></div>' +
          '<span class="badge ' + (m.role === 'owner' ? 'b-ok' : 'b-info') + '">' + (m.role === 'owner' ? 'Owner' : 'Staff · orders only') + '</span>' +
          (owner && !me ? '<span class="pop-wrap"><button class="rowmenu" data-tm="' + m.id + '" aria-label="Member actions">' + A.ic('dot-grid1x3-horizontal', 18) + '</button></span>' : '<span style="width:24px"></span>') + '</div>';
      }).join('') : '<p class="note">No team members yet.</p>';
    }

    function wire() {
      page.querySelectorAll('.tab').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); page.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === a); }); var el = $(a.getAttribute('data-tab')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }); });
      if (!owner) return;
      $('sName').addEventListener('input', function (e) { S.store.name = e.target.value; mark(); });
      $('sLow').addEventListener('input', function (e) { S.inventory.low = Math.max(0, parseInt(e.target.value, 10) || 0); mark(); });
      $('gaId').addEventListener('input', function (e) { S.analytics.ga_id = e.target.value.trim(); mark(); });
      $('fbId').addEventListener('input', function (e) { S.analytics.fb_pixel = e.target.value.trim(); mark(); });
      ['cod', 'bkash', 'nagad'].forEach(function (k) { $('pay_' + k).addEventListener('click', function () { S.payments[k].on = !S.payments[k].on; $('pay_' + k).setAttribute('aria-checked', S.payments[k].on); mark(); }); });
      NOTIFS.forEach(function (n) { $('nt_' + n[0]).addEventListener('click', function () { S.notifications[n[0]] = !S.notifications[n[0]]; $('nt_' + n[0]).setAttribute('aria-checked', S.notifications[n[0]]); $('ns_' + n[0]).textContent = S.notifications[n[0]] ? 'Email me' : 'Off'; mark(); }); });
      page.querySelectorAll('[data-num]').forEach(function (b) { b.addEventListener('click', function () {
        var k = b.getAttribute('data-num');
        A.modal('<h3>' + (k === 'bkash' ? 'bKash' : 'Nagad') + ' merchant number</h3><div class="f"><label for="mn">Number</label><input class="text" id="mn" inputmode="tel" placeholder="01XXX XXXXXX" value="' + A.esc(S.payments[k].number || '') + '"></div><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="mnOk">Save</button></div>', function (o, close) {
          o.querySelector('#mnOk').addEventListener('click', function () { S.payments[k].number = o.querySelector('#mn').value.trim(); mark(); close(); draw(); });
        });
      }); });
      $('save').addEventListener('click', async function () {
        var btn = $('save'); btn.disabled = true; btn.textContent = 'Saving…';
        var u = await A.sb.from('settings').upsert(['store', 'payments', 'notifications', 'analytics', 'inventory'].map(function (k) { return { key: k, value: S[k] }; }), { onConflict: 'key' });
        btn.disabled = false; btn.textContent = 'Save settings';
        if (u.error) { A.toast('Could not save: ' + u.error.message, true); return; }
        dirty = false; A.toast('Settings saved');
      });
      $('invite').addEventListener('click', function () {
        A.modal('<h3>Invite someone</h3><p class="sub" style="line-height:1.5">For security, new sign-ins are created in your Supabase project:</p>' +
          '<ol style="margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--text)"><li>Supabase → Authentication → Users → Add user</li><li>Enter their email and a password, tick “Auto confirm user”</li><li>Come back here: they appear as <b>Staff · orders only</b>. Use the menu to make them an owner if needed.</li></ol><div class="actions"><button class="btn primary" data-close>Got it</button></div>');
      });
      $('teamList').addEventListener('click', function (e) {
        var b = e.target.closest('[data-tm]'); if (!b) return; e.stopPropagation();
        var m = team.filter(function (x) { return x.id === b.getAttribute('data-tm'); })[0];
        var items = [m.role === 'owner' ? { v: 'staff', l: 'Make staff (orders only)' } : { v: 'owner', l: 'Make owner (full access)' }, { v: 'remove', l: 'Remove access' }];
        A.menu(b.parentNode, items, null, async function (v) {
          if (v === 'remove') { if (!confirm('Remove ' + (m.full_name || m.email) + '? They will no longer be able to open the admin.')) return; var d = await A.sb.from('profiles').delete().eq('id', m.id); if (d.error) { A.toast('Could not remove: ' + d.error.message, true); return; } team = team.filter(function (x) { return x.id !== m.id; }); }
          else { if (v === 'owner' && !confirm('Make ' + (m.full_name || m.email) + ' an owner? They will see prices, revenue and settings.')) return; var u = await A.sb.from('profiles').update({ role: v }).eq('id', m.id); if (u.error) { A.toast('Could not update: ' + u.error.message, true); return; } m.role = v; }
          drawTeam(); A.toast('Team updated');
        });
        var pop = b.parentNode.querySelector('.pop'); if (pop) pop.classList.add('right');
      });
      $('chpw').addEventListener('click', function () {
        A.modal('<h3>Change password</h3><div class="f"><label for="np">New password</label><input class="text" id="np" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div><p class="err-text" id="pe" hidden style="color:var(--bad);font-size:12px"></p><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="npOk">Update password</button></div>', function (o, close) {
          o.querySelector('#npOk').addEventListener('click', async function () {
            var v = o.querySelector('#np').value, er = o.querySelector('#pe');
            if (v.length < 8) { er.textContent = 'Use at least 8 characters.'; er.hidden = false; return; }
            var u = await A.sb.auth.updateUser({ password: v });
            if (u.error) { er.textContent = u.error.message; er.hidden = false; return; }
            close(); A.toast('Password updated');
          });
        });
      });
      $('soAll').addEventListener('click', async function () { await A.sb.auth.signOut({ scope: 'global' }); try { sessionStorage.removeItem('elara.admin.alive'); } catch (e) {} location.href = 'index.html'; });
      window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
    }
    // staff see their own account only: keep the page useful and read-only
    draw();
  }
});
</script>
</body>
</html>
