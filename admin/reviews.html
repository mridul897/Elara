<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Reviews · ELARA Admin</title>
<link rel="icon" href="favicon1.png">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="admin.css">
<style>
  .review { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 16px; display: flex; gap: 16px; align-items: flex-start; }
  .review img { width: 48px; height: 60px; border-radius: 6px; object-fit: cover; flex: none; background: var(--canvas); }
  .review .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .review .pn { font-size: 12px; font-weight: 500; color: var(--sub); }
  .review .ti { font-size: 15px; font-weight: 600; }
  .review .bd { font-size: 13px; line-height: 20px; max-width: 640px; }
  .review .by { font-size: 12px; color: var(--mute); }
  .review .a { display: flex; gap: 8px; flex: none; }
  .c-r { width: 96px; } .c-pr { width: 160px; } .c-dt { width: 90px; } .c-ac { width: 60px; }
  .linkact { background: none; border: 0; padding: 0; font-size: 13px; font-weight: 500; color: var(--accent); }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 900px) { .review { flex-wrap: wrap; } }

  @media (max-width: 899.98px) { .c-pr, .c-dt { display: none; } .review .a { width: 100%; } .review .a .btn { flex: 1; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="icons.js"></script>
<script src="admin.js"></script>
<script>
A.boot({
  active: 'reviews',
  crumbs: [{ t: 'Reviews' }],
  render: async function (page, ctx) {
    var $ = function (id) { return document.getElementById(id); };
    var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var dShort = function (iso) { var d = new Date(iso); return d.getDate() + ' ' + MON[d.getMonth()]; };
    var state = { tab: 'pending', rows: [] };
    page.innerHTML = '<div class="page-head"><div class="t"><h1 class="h1">Reviews</h1><p class="sub" id="sub">Loading…</p></div></div><div class="tabs" id="tabs"></div><div class="stack" id="list"></div>';
    var res = await A.sb.from('reviews').select('*, products(name, product_colours(card, position))').order('created_at', { ascending: false }).limit(2000);
    if (res.error) { $('list').innerHTML = '<div class="empty card"><b>Could not load reviews</b>' + A.esc(res.error.message) + '</div>'; $('sub').textContent = ''; return; }
    state.rows = res.data;

    function thumb(r) { var c = ((r.products && r.products.product_colours) || []).slice().sort(function (a, b) { return a.position - b.position; })[0]; return c ? A.img(c.card) : ''; }
    function draw() {
      var cnt = { pending: 0, approved: 0, hidden: 0 }, sum = 0;
      state.rows.forEach(function (r) { cnt[r.status]++; if (r.status === 'approved') sum += r.rating; });
      $('sub').textContent = cnt.pending + ' waiting for approval · ' + (cnt.approved ? (sum / cnt.approved).toFixed(1) + ' average across ' + cnt.approved + ' review' + (cnt.approved === 1 ? '' : 's') : 'no approved reviews yet');
      var T = [['pending', 'Pending'], ['approved', 'Approved'], ['hidden', 'Hidden']];
      $('tabs').innerHTML = T.map(function (t) { return '<button class="tab' + (state.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '"><span class="l">' + t[1] + '<span class="b">' + cnt[t[0]] + '</span></span><span class="bar"></span></button>'; }).join('');
      var rows = state.rows.filter(function (r) { return r.status === state.tab; });
      if (!rows.length) { $('list').innerHTML = '<div class="empty card"><b>' + (state.tab === 'pending' ? 'Nothing waiting' : 'No ' + state.tab + ' reviews') + '</b>' + (state.tab === 'pending' ? 'New reviews from the store show up here for you to approve.' : '') + '</div>'; return; }
      if (state.tab === 'pending') {
        $('list').innerHTML = rows.map(function (r) {
          return '<div class="review"><img src="' + A.esc(thumb(r)) + '" alt=""><div class="t"><p class="pn">' + A.esc((r.products && r.products.name) || r.product_id) + '</p>' + A.stars(r.rating) +
            (r.title ? '<p class="ti">' + A.esc(r.title) + '</p>' : '') + '<p class="bd">' + A.esc(r.body || '') + '</p><p class="by">' + A.esc(r.author) + ' · ' + dShort(r.created_at) + '</p></div>' +
            '<div class="a"><button class="btn sm" data-act="hidden" data-id="' + r.id + '">Hide</button><button class="btn primary sm" data-act="approved" data-id="' + r.id + '">' + A.ic('check16', 16) + 'Approve</button></div></div>';
        }).join('');
      } else {
        $('list').innerHTML = '<div class="table"><div class="trow head"><span class="c c-r">Rating</span><span class="grow">Review</span><span class="c c-pr">Product</span><span class="c c-dt">Date</span><span class="c c-ac"></span></div>' +
          rows.map(function (r) {
            return '<div class="trow"><span class="c c-r">' + A.stars(r.rating) + '</span><span class="grow strong">' + A.esc(r.title || r.body || '') + '</span><span class="c c-pr">' + A.esc((r.products && r.products.name) || r.product_id) + '</span><span class="c c-dt">' + dShort(r.created_at) + '</span>' +
              '<span class="c c-ac"><button class="linkact" data-act="' + (state.tab === 'approved' ? 'hidden' : 'approved') + '" data-id="' + r.id + '">' + (state.tab === 'approved' ? 'Hide' : 'Show') + '</button></span></div>';
          }).join('') + '</div>';
      }
    }
    page.addEventListener('click', async function (e) {
      var t = e.target.closest('[data-tab]'); if (t) { state.tab = t.getAttribute('data-tab'); draw(); return; }
      var b = e.target.closest('[data-act]'); if (!b || ctx.role !== 'owner') return;
      var id = +b.getAttribute('data-id'), to = b.getAttribute('data-act'), r = state.rows.filter(function (x) { return x.id === id; })[0];
      var u = await A.sb.from('reviews').update({ status: to }).eq('id', id).select('id').maybeSingle();
      if (u.error || !u.data) { A.toast('Could not save: ' + ((u.error && u.error.message) || 'no permission'), true); return; }
      r.status = to; draw(); A.toast(to === 'approved' ? 'Review approved. It is now on the store.' : 'Review hidden');
    });
    draw();
  }
});
</script>
</body>
</html>
