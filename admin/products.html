<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Products · ELARA Admin</title>
<link rel="icon" href="favicon1.png">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="admin.css">
<style>
  .trow.prow { padding: 10px 16px; }
  .prod { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
  .prod img { width: 40px; height: 50px; border-radius: 6px; object-fit: cover; flex: none; background: var(--canvas); }
  .prod .t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .prod .n { font-size: 13px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prod .m { font-size: 12px; color: var(--mute); }
  .c-cat { width: 120px; } .c-price { width: 110px; } .c-stock { width: 110px; } .c-live { width: 56px; } .c-menu { width: 24px; }
  .price .now { font-size: 13px; font-weight: 500; color: var(--text); display: block; }
  .price .was { font-size: 12px; color: var(--mute); display: block; }
  .tog { width: 36px; height: 20px; border-radius: 10px; border: 0; padding: 0; background: #d5d8de; position: relative; transition: background .15s; flex: none; }
  .tog::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .tog[aria-checked="true"] { background: var(--accent); }
  .tog[aria-checked="true"]::after { left: 18px; }
  .tog[disabled] { opacity: .5; cursor: default; }
  .btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  @media (max-width: 899.98px) {
    .trow.prow { align-items: center; }
    .trow.prow > span:first-child, .trow.prow .c-cat, .trow.prow .c-menu { display: none; }
    .prod { flex: 1 1 100%; }
    .prod img { width: 48px; height: 60px; }
    .prod .n { font-size: 14px; font-weight: 600; white-space: normal; }
    .c-price, .c-stock { width: auto; } .c-live { margin-left: auto; width: auto; }
    .trow.prow { gap: 10px 12px; }
  }

  #table { max-height: calc(100vh - 330px); min-height: 240px; overflow-y: auto; overscroll-behavior: contain; }
  #table .trow.head { position: sticky; top: 0; z-index: 2; }
  .pcount { font-size: 13px; color: var(--sub); margin: 0; }
  @media (max-width: 899.98px) { #table { max-height: none; overflow: visible; } }

  .chk { cursor: pointer; position: relative; }
  .chk.on { background: var(--accent); border-color: var(--accent); }
  .chk.on::after { content: ''; position: absolute; left: 4px; top: 2px; width: 4px; height: 8px; border: solid #fff; border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); }
  .bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; background: var(--accent-soft); border: 1px solid #c9d5fa; border-radius: var(--r-card); font-size: 13px; }
  .bulk b { margin-right: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="icons.js"></script>
<script src="admin.js"></script>
<script>
A.boot({
  active: 'products',
  crumbs: [{ t: 'Products' }],
  render: async function (page, ctx) {
    var CHUNK = 30, LOW = 5;
    var state = { tab: 'all', q: '', cat: 'all', sale: false, sort: 'best', limit: 30, total: 0, sel: {}, rows: [] };
    var TABS = [['all', 'All'], ['published', 'Published'], ['draft', 'Draft'], ['archived', 'Archived'], ['low', 'Low stock']];
    var CATS = [{ v: 'all', l: 'All categories' }, { v: 'tote', l: 'Tote' }, { v: 'shoulder', l: 'Shoulder' }, { v: 'crossbody', l: 'Crossbody' }, { v: 'mini', l: 'Mini' }, { v: 'travel-work', l: 'Travel & Work' }];
    var SORTS = [{ v: 'best', l: 'Best selling' }, { v: 'new', l: 'Newest first' }, { v: 'low', l: 'Price: low to high' }, { v: 'high', l: 'Price: high to low' }, { v: 'az', l: 'Name A to Z' }];
    var catName = function (v) { return (CATS.filter(function (c) { return c.v === v; })[0] || {}).l || v; };
    var sortName = function (v) { return SORTS.filter(function (c) { return c.v === v; })[0].l; };
    var $ = function (id) { return document.getElementById(id); };

    page.innerHTML =
      '<div class="page-head"><div class="t"><h1 class="h1">Products</h1><p class="sub" id="sub">Loading…</p></div>' +
      '<button class="btn" id="import">' + A.ic('arrow-out-of-box', 16) + 'Import</button>' +
      '<a class="btn primary" href="product.html?new=1">' + A.ic('plus-small', 16) + 'Add product</a></div>' +
      '<div class="tabs" id="tabs"></div>' +
      '<div class="toolbar"><label class="field-search">' + A.ic('magnifying-glass', 16) + '<input id="q" placeholder="Search products" aria-label="Search products"></label>' +
      '<div class="pop-wrap" id="catWrap"><button class="btn" id="catBtn"><span id="catTxt">Category</span>' + A.ic('chevron-down-small', 16) + '</button></div>' +
      '<button class="btn" id="saleBtn">' + A.ic('percent16', 16) + 'On sale</button>' +
      '<div class="pop-wrap" id="sortWrap"><button class="btn" id="sortBtn"><span id="sortTxt">Best selling</span>' + A.ic('chevron-down-small', 16) + '</button></div></div>' +
      '<div class="bulk" id="bulk" hidden></div><div class="table" id="table"></div>' +
      '<p class="pcount" id="info"></p>';
    $('table').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

    try { var inv = await A.sb.from('settings').select('value').eq('key', 'inventory').maybeSingle(); if (inv.data && inv.data.value && +inv.data.value.low >= 0) LOW = +inv.data.value.low; } catch (e) {}
    var res = await A.sb.from('products').select('id,name,cat,price,sale_price,sale_starts,sale_ends,status,position,product_colours(id,card,position,product_variants(size,stock))').order('position').limit(1000);
    if (res.error) { $('table').innerHTML = '<div class="empty"><b>Could not load products</b>' + A.esc(res.error.message) + '</div>'; $('sub').textContent = ''; return; }
    var sold = {};
    var oi = await A.sb.from('order_items').select('product_id,qty').limit(5000);
    (oi.data || []).forEach(function (i) { sold[i.product_id] = (sold[i.product_id] || 0) + i.qty; });

    var now = Date.now();
    state.rows = res.data.map(function (p) {
      var cols = (p.product_colours || []).slice().sort(function (a, b) { return a.position - b.position; });
      var allVars = []; cols.forEach(function (c) { (c.product_variants || []).forEach(function (v) { allVars.push(v); }); });
      var sizes = {}; allVars.forEach(function (v) { sizes[v.size] = 1; });
      var onSale = p.sale_price != null && (!p.sale_starts || new Date(p.sale_starts) <= now) && (!p.sale_ends || new Date(p.sale_ends) >= now);
      return Object.assign(p, {
        thumb: cols[0] && cols[0].card, nCol: cols.length, nSize: Object.keys(sizes).length,
        stock: allVars.reduce(function (s, v) { return s + v.stock; }, 0),
        onSale: onSale, now: onSale ? p.sale_price : p.price, sold: sold[p.id] || 0
      });
    });

    function visible() {
      var q = state.q.trim().toLowerCase();
      var list = state.rows.filter(function (p) {
        if (state.tab === 'published' && p.status !== 'published') return false;
        if (state.tab === 'draft' && p.status !== 'draft') return false;
        if (state.tab === 'archived' && p.status !== 'archived') return false;
        if (state.tab === 'low' && !(p.status === 'published' && p.stock <= LOW)) return false;
        if (state.cat !== 'all' && p.cat !== state.cat) return false;
        if (state.sale && !p.onSale) return false;
        if (q && (p.name + ' ' + p.id).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
      var by = { best: function (a, b) { return b.sold - a.sold || a.position - b.position; }, 'new': function (a, b) { return a.position - b.position; },
        low: function (a, b) { return a.now - b.now; }, high: function (a, b) { return b.now - a.now; }, az: function (a, b) { return a.name.localeCompare(b.name); } };
      return list.sort(by[state.sort]);
    }

    function draw() {
      var cnt = { all: state.rows.length, published: 0, draft: 0, archived: 0, low: 0 };
      state.rows.forEach(function (p) { cnt[p.status]++; if (p.status === 'published' && p.stock <= LOW) cnt.low++; });
      $('sub').textContent = state.rows.length + ' products · ' + cnt.low + ' low on stock';
      $('tabs').innerHTML = TABS.map(function (t) { return '<button class="tab' + (state.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '"><span class="l">' + t[1] + '<span class="b">' + cnt[t[0]] + '</span></span><span class="bar"></span></button>'; }).join('');
      $('catTxt').textContent = state.cat === 'all' ? 'Category' : catName(state.cat);
      $('sortTxt').textContent = sortName(state.sort);
      $('saleBtn').classList.toggle('on', state.sale);

      var list = visible(), keepTop = $('table').scrollTop;
      state.total = list.length;
      var slice = list.slice(0, state.limit);
      var allSel = slice.length && slice.every(function (p) { return state.sel[p.id]; });
      var head = '<div class="trow head"><span class="c" style="width:16px">' + (ctx.role === 'owner' ? '<span class="chk' + (allSel ? ' on' : '') + '" data-selall="1" role="checkbox" aria-checked="' + !!allSel + '" aria-label="Select all"></span>' : '') + '</span><span class="grow">Product</span><span class="c c-cat">Category</span><span class="c c-price">Price</span><span class="c c-stock">Stock</span><span class="c c-live">Live</span><span class="c c-menu"></span></div>';
      if (!slice.length) {
        $('table').innerHTML = head + '<div class="empty"><b>' + (state.rows.length ? 'No products match these filters' : 'No products yet') + '</b>' + (state.rows.length ? 'Try a different tab, category or search.' : 'Add your first product to start selling.') + '</div>';
      } else {
        $('table').innerHTML = head + slice.map(function (p) {
          var sb = p.stock <= 0 ? ['Out of stock', 'b-bad'] : p.stock <= LOW ? [p.stock + ' in stock', 'b-warn'] : [p.stock + ' in stock', 'b-mute'];
          return '<div class="trow prow link" data-id="' + A.esc(p.id) + '"><span class="c" style="width:16px">' + (ctx.role === 'owner' ? '<span class="chk' + (state.sel[p.id] ? ' on' : '') + '" data-sel="' + A.esc(p.id) + '" role="checkbox" aria-checked="' + !!state.sel[p.id] + '"></span>' : '') + '</span>' +
            '<div class="prod">' + (p.thumb ? '<img src="' + A.esc(A.img(p.thumb)) + '" alt="" loading="lazy">' : '<img alt="">') + '<div class="t"><p class="n">' + A.esc(p.name) + '</p><p class="m">' + p.nCol + ' colour' + (p.nCol === 1 ? '' : 's') + ' · ' + p.nSize + ' size' + (p.nSize === 1 ? '' : 's') + '</p></div></div>' +
            '<span class="c c-cat">' + A.esc(catName(p.cat)) + '</span>' +
            '<span class="c c-price price"><span class="now">' + A.money(p.now) + '</span>' + (p.onSale ? '<span class="was">' + A.money(p.price) + '</span>' : '') + '</span>' +
            '<span class="c c-stock"><span class="badge ' + sb[1] + '">' + sb[0] + '</span></span>' +
            '<span class="c c-live"><button class="tog" role="switch" aria-label="Live on the store" aria-checked="' + (p.status === 'published') + '" data-live="' + A.esc(p.id) + '"' + (p.status === 'archived' || ctx.role !== 'owner' ? ' disabled' : '') + '></button></span>' +
            '<span class="c c-menu"><button class="rowmenu" data-menu="' + A.esc(p.id) + '" aria-label="Product actions">' + A.ic('dot-grid1x3-horizontal', 18) + '</button></span></div>';
        }).join('');
      }
      $('table').scrollTop = keepTop;
      drawBulk();
      $('info').textContent = list.length + ' product' + (list.length === 1 ? '' : 's') + (list.length > slice.length ? ' · scroll for more' : '');
    }

    async function setStatus(p, status) {
      var u = await A.sb.from('products').update({ status: status }).eq('id', p.id).select('id,status').maybeSingle();
      if (u.error || !u.data) { A.toast('Could not save: ' + ((u.error && u.error.message) || 'no permission'), true); return false; }
      p.status = status; return true;
    }
    var byId = function (id) { return state.rows.filter(function (p) { return p.id === id; })[0]; };
    function selected() { return state.rows.filter(function (p) { return state.sel[p.id]; }); }
    function drawBulk() {
      var sel = selected(), box = $('bulk'); box.hidden = !sel.length; if (!sel.length) return;
      box.innerHTML = '<b>' + sel.length + ' selected</b><button class="btn sm" data-b="pub">Publish</button><button class="btn sm" data-b="hide">Hide</button><button class="btn sm" data-b="sale">Set sale %</button><button class="btn sm" data-b="nosale">End sale</button><button class="btn sm" data-b="arch">Archive</button><button class="btn sm" data-b="clr">Clear</button>';
    }
    async function bulkUpdate(list, patchFor) {
      var res = await Promise.all(list.map(function (p) { var patch = patchFor(p); if (!patch) return Promise.resolve({ p: p, skip: true }); return A.sb.from('products').update(patch).eq('id', p.id).select('id').maybeSingle().then(function (u) { return { p: p, ok: !u.error && !!u.data, patch: patch }; }); }));
      var ok = 0, skipped = 0; res.forEach(function (x) { if (x.skip) skipped++; else if (x.ok) { Object.assign(x.p, x.patch); ok++; } });
      state.sel = {}; draw(); A.toast(ok + ' product' + (ok === 1 ? '' : 's') + ' updated' + (skipped ? ' · ' + skipped + ' skipped (no photo yet)' : ''), false);
    }
    $('bulk').addEventListener('click', async function (e) {
      var b = e.target.closest('[data-b]'); if (!b) return; var k = b.getAttribute('data-b'), sel = selected();
      if (k === 'clr') { state.sel = {}; draw(); return; }
      if (k === 'pub') return bulkUpdate(sel, function (p) { return p.thumb ? { status: 'published' } : null; });
      if (k === 'hide') return bulkUpdate(sel, function () { return { status: 'draft' }; });
      if (k === 'arch') { if (!confirm('Archive ' + sel.length + ' product' + (sel.length === 1 ? '' : 's') + '? They disappear from the store.')) return; return bulkUpdate(sel, function () { return { status: 'archived' }; }); }
      if (k === 'nosale') return bulkUpdate(sel, function () { return { sale_price: null, sale_starts: null, sale_ends: null }; });
      if (k === 'sale') {
        A.modal('<h3>Set a sale</h3><p class="sub">Takes this much off the regular price of ' + sel.length + ' product' + (sel.length === 1 ? '' : 's') + '. You can end it any time.</p><div class="f"><label for="spc">Percent off</label><input class="text" id="spc" type="number" min="1" max="90" value="10"></div><p class="hint" style="font-size:12px;color:var(--bad)" id="spe"></p><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="spo">Apply</button></div>', function (o, close) {
          o.querySelector('#spo').addEventListener('click', function () {
            var pc = parseInt(o.querySelector('#spc').value, 10);
            if (!(pc >= 1 && pc <= 90)) { o.querySelector('#spe').textContent = 'Enter a number from 1 to 90.'; return; }
            close(); bulkUpdate(sel, function (p) { return { sale_price: Math.round(p.price * (100 - pc) / 100), sale_starts: null, sale_ends: null }; });
          });
        });
      }
    });
    async function duplicate(p) {
      var base = p.id.replace(/-copy(-\d+)?$/, ''), n = 1, id = base + '-copy';
      while (state.rows.some(function (x) { return x.id === id; })) { n++; id = base + '-copy-' + n; }
      var src = await A.sb.from('products').select('*, product_colours(*, product_variants(size,stock))').eq('id', p.id).maybeSingle();
      if (src.error || !src.data) { A.toast('Could not read the product.', true); return; }
      var d = src.data, row = Object.assign({}, d); delete row.product_colours; delete row.created_at; delete row.updated_at;
      Object.assign(row, { id: id, name: d.name + ' (copy)', status: 'draft', position: 0, rating: 0, reviews_count: 0 });
      var r1 = await A.sb.from('products').insert(row); if (r1.error) { A.toast('Could not duplicate: ' + r1.error.message, true); return; }
      var cols = (d.product_colours || []).map(function (c) { var o = Object.assign({}, c); delete o.product_variants; o.product_id = id; return o; });
      var vars = []; (d.product_colours || []).forEach(function (c) { (c.product_variants || []).forEach(function (v) { vars.push({ product_id: id, colour_id: c.id, size: v.size, stock: v.stock }); }); });
      if (cols.length) { var r2 = await A.sb.from('product_colours').insert(cols); if (r2.error) { A.toast('Copied the details but not the colours: ' + r2.error.message, true); return; } }
      if (vars.length) await A.sb.from('product_variants').insert(vars);
      location.href = 'product.html?id=' + encodeURIComponent(id);
    }

    $('tabs').addEventListener('click', function (e) { var t = e.target.closest('[data-tab]'); if (!t) return; state.tab = t.getAttribute('data-tab'); state.limit = CHUNK; $('table').scrollTop = 0; draw(); });
    var tm; $('q').addEventListener('input', function (e) { clearTimeout(tm); tm = setTimeout(function () { state.q = e.target.value; state.limit = CHUNK; $('table').scrollTop = 0; draw(); }, 120); });
    $('catBtn').addEventListener('click', function (e) { e.stopPropagation(); A.menu($('catWrap'), CATS, state.cat, function (v) { state.cat = v; state.limit = CHUNK; $('table').scrollTop = 0; draw(); }); });
    $('sortBtn').addEventListener('click', function (e) { e.stopPropagation(); A.menu($('sortWrap'), SORTS, state.sort, function (v) { state.sort = v; state.limit = CHUNK; $('table').scrollTop = 0; draw(); }); });
    $('saleBtn').addEventListener('click', function () { state.sale = !state.sale; state.limit = CHUNK; $('table').scrollTop = 0; draw(); });
    // load the next rows when the end of the table comes into view (inside the table on desktop, the page on phones)
    function more() {
      if (state.limit >= state.total) return;
      var t = $('table'), inner = t.scrollHeight - t.scrollTop - t.clientHeight < 240, r = t.getBoundingClientRect(), outer = r.bottom < window.innerHeight + 240;
      if (inner && outer) { state.limit += CHUNK; draw(); }
    }
    $('table').addEventListener('scroll', more);
    window.addEventListener('scroll', more, { passive: true });
    window.addEventListener('resize', more);
    // ----- CSV import: one row per colour + size; rows with the same name become one product (saved as a draft)
    var CATMAP = { tote: 'tote', shoulder: 'shoulder', crossbody: 'crossbody', mini: 'mini', 'travel-work': 'travel-work', 'travel & work': 'travel-work', 'travel and work': 'travel-work', travel: 'travel-work' };
    var EYE = { tote: 'Tote Bags · Premium Leather', shoulder: 'Shoulder Bags · Premium Leather', crossbody: 'Crossbody Bags · Premium Leather', mini: 'Mini Bags · Premium Leather', 'travel-work': 'Travel & Work Bags · Premium Leather' };
    var CRUMB = { tote: 'Tote', shoulder: 'Shoulder', crossbody: 'Crossbody', mini: 'Mini', 'travel-work': 'Travel & Work' };
    function parseCSV(text) {
      var rows = [], row = [], cur = '', q = false;
      text = text.replace(/^\ufeff/, '');
      for (var i = 0; i < text.length; i++) {
        var ch = text[i];
        if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
        else if (ch === '"') q = true;
        else if (ch === ',') { row.push(cur); cur = ''; }
        else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(function (c) { return c.trim() !== ''; })) rows.push(row); row = []; }
        else cur += ch;
      }
      row.push(cur); if (row.some(function (c) { return c.trim() !== ''; })) rows.push(row);
      return rows;
    }
    function buildImport(text) {
      var rows = parseCSV(text), out = { products: [], errors: [] };
      if (rows.length < 2) { out.errors.push('The file has no data rows.'); return out; }
      var head = rows[0].map(function (h) { return h.trim().toLowerCase().replace(/[^a-z]/g, ''); });
      var col = function (names) { for (var i = 0; i < names.length; i++) { var k = head.indexOf(names[i]); if (k >= 0) return k; } return -1; };
      var ix = { name: col(['name', 'product', 'productname']), cat: col(['category', 'cat']), price: col(['price', 'regularprice']), sale: col(['saleprice', 'sale']), desc: col(['description', 'desc']), colour: col(['colour', 'color']), size: col(['size']), stock: col(['stock', 'qty', 'quantity']) };
      if (ix.name < 0 || ix.cat < 0 || ix.price < 0) { out.errors.push('The first row must have the columns: name, category, price (see the template).'); return out; }
      var by = {}, order = [];
      rows.slice(1).forEach(function (r, n) {
        var line = n + 2, name = (r[ix.name] || '').trim(); if (!name) return;
        var cat = CATMAP[(r[ix.cat] || '').trim().toLowerCase()], price = parseInt(String(r[ix.price] || '').replace(/[^0-9]/g, ''), 10);
        if (!cat) { out.errors.push('Row ' + line + ': category "' + (r[ix.cat] || '') + '" is not one of tote, shoulder, crossbody, mini, travel-work.'); return; }
        if (!(price > 0)) { out.errors.push('Row ' + line + ': price must be a number above zero.'); return; }
        var id = A.slug(name); if (!id) { out.errors.push('Row ' + line + ': the name needs letters or numbers.'); return; }
        var p = by[id];
        if (!p) { p = by[id] = { id: id, name: name, cat: cat, price: price, sale: null, desc: '', variants: [] }; order.push(id); }
        var sale = ix.sale >= 0 ? parseInt(String(r[ix.sale] || '').replace(/[^0-9]/g, ''), 10) : NaN;
        if (sale > 0 && sale < price) p.sale = sale;
        if (ix.desc >= 0 && (r[ix.desc] || '').trim() && !p.desc) p.desc = r[ix.desc].trim();
        var colour = (ix.colour >= 0 && (r[ix.colour] || '').trim()) || 'Default', size = ix.size >= 0 ? (r[ix.size] || '').trim() : '';
        size = ['small', 'medium', 'large'].indexOf(size.toLowerCase()) >= 0 ? size.charAt(0).toUpperCase() + size.slice(1).toLowerCase() : 'Medium';
        var stock = ix.stock >= 0 ? Math.max(0, parseInt(String(r[ix.stock] || '').replace(/[^0-9]/g, ''), 10) || 0) : 0;
        if (!p.variants.some(function (v) { return v.colour === colour && v.size === size; })) p.variants.push({ colour: colour, size: size, stock: stock });
      });
      out.products = order.map(function (id) { return by[id]; });
      return out;
    }
    $('import').addEventListener('click', function () {
      if (ctx.role !== 'owner') { A.toast('Only the owner can import products.', true); return; }
      A.modal('<h3>Import products</h3><p class="sub" style="line-height:1.5">Upload a CSV file. Each row is one colour and size; rows with the same name become one product. Products arrive as <b>drafts without photos</b>: add photos, then publish.</p>' +
        '<div><button class="btn sm" id="tpl">Download template</button></div><input type="file" id="csvFile" accept=".csv,text/csv"><div id="csvOut" class="sub"></div>' +
        '<div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="csvGo" disabled>Import</button></div>', function (o, close) {
        var parsed = null;
        o.querySelector('#tpl').addEventListener('click', function () {
          var csv = 'name,category,price,sale_price,description,colour,size,stock\r\nSample Tote,tote,4500,,Roomy everyday tote,Camel,Medium,8\r\nSample Tote,tote,4500,,,Camel,Large,4\r\nSample Tote,tote,4500,,,Black,Medium,6\r\n';
          var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'elara-products-template.csv'; a.click(); URL.revokeObjectURL(a.href);
        });
        o.querySelector('#csvFile').addEventListener('change', function (e) {
          var f = e.target.files[0]; if (!f) return;
          var rd = new FileReader();
          rd.onload = function () {
            parsed = buildImport(String(rd.result));
            var exist = {}; state.rows.forEach(function (p) { exist[p.id] = 1; });
            var fresh = parsed.products.filter(function (p) { return !exist[p.id]; }), dup = parsed.products.length - fresh.length;
            parsed.products = fresh;
            var vcount = fresh.reduce(function (s, p) { return s + p.variants.length; }, 0);
            o.querySelector('#csvOut').innerHTML = '<p><b>' + fresh.length + '</b> new product' + (fresh.length === 1 ? '' : 's') + ' · ' + vcount + ' colour/size row' + (vcount === 1 ? '' : 's') + (dup ? ' · ' + dup + ' skipped (already exist)' : '') + '</p>' +
              (parsed.errors.length ? '<ul style="margin:8px 0 0;padding-left:18px;color:var(--bad);font-size:12px">' + parsed.errors.slice(0, 6).map(function (m) { return '<li>' + A.esc(m) + '</li>'; }).join('') + (parsed.errors.length > 6 ? '<li>…and ' + (parsed.errors.length - 6) + ' more</li>' : '') + '</ul>' : '');
            o.querySelector('#csvGo').disabled = !fresh.length;
          };
          rd.readAsText(f);
        });
        o.querySelector('#csvGo').addEventListener('click', async function () {
          var go = o.querySelector('#csvGo'); go.disabled = true; go.textContent = 'Importing…';
          var pos = state.rows.reduce(function (m, p) { return Math.max(m, p.position || 0); }, 0);
          var prodRows = parsed.products.map(function (p, i) { return { id: p.id, name: p.name, cat: p.cat, eyebrow: EYE[p.cat], crumb: CRUMB[p.cat], price: p.price, sale_price: p.sale, description: p.desc || null, status: 'draft', position: pos + 1 + i }; });
          var r1 = await A.sb.from('products').insert(prodRows);
          if (r1.error) { go.disabled = false; go.textContent = 'Import'; A.toast('Import failed: ' + r1.error.message, true); return; }
          var cols = [], vars = [];
          parsed.products.forEach(function (p) {
            var seen = {};
            p.variants.forEach(function (v) {
              var cid = A.slug(v.colour) || 'default';
              if (!seen[cid]) { seen[cid] = 1; cols.push({ product_id: p.id, id: cid, label: v.colour, hex: '#c9c4bb', photos: [], slides: [], position: cols.length }); }
              vars.push({ product_id: p.id, colour_id: cid, size: v.size, stock: v.stock });
            });
          });
          var r2 = cols.length ? await A.sb.from('product_colours').insert(cols) : {};
          var r3 = !r2.error && vars.length ? await A.sb.from('product_variants').insert(vars) : {};
          if (r2.error || r3.error) { A.toast('Products were added but colours or stock failed: ' + ((r2.error || r3.error).message), true); }
          else A.toast(parsed.products.length + ' product' + (parsed.products.length === 1 ? '' : 's') + ' imported as drafts');
          close(); setTimeout(function () { location.reload(); }, 900);
        });
      });
    });
    $('table').addEventListener('click', async function (e) {
      var sa = e.target.closest('[data-selall]');
      if (sa) { e.stopPropagation(); var vis = visible().slice(0, state.limit), all = vis.length && vis.every(function (x) { return state.sel[x.id]; }); vis.forEach(function (x) { if (all) delete state.sel[x.id]; else state.sel[x.id] = 1; }); draw(); return; }
      var sc = e.target.closest('[data-sel]');
      if (sc) { e.stopPropagation(); var k2 = sc.getAttribute('data-sel'); if (state.sel[k2]) delete state.sel[k2]; else state.sel[k2] = 1; draw(); return; }
      var lv = e.target.closest('[data-live]');
      if (lv) {
        e.stopPropagation();
        var p = byId(lv.getAttribute('data-live')), to = p.status === 'published' ? 'draft' : 'published';
        if (to === 'published' && !p.thumb) { A.toast('Add at least one photo to ' + p.name + ' before publishing it.', true); return; }
        if (await setStatus(p, to)) { draw(); A.toast(p.name + (to === 'published' ? ' is live on the store' : ' is hidden from the store')); }
        return;
      }
      var m = e.target.closest('[data-menu]');
      if (m) {
        e.stopPropagation();
        var p2 = byId(m.getAttribute('data-menu'));
        var items = [{ v: 'edit', l: 'Edit product' }, { v: 'view', l: 'View on store' }];
        if (ctx.role === 'owner') items.push({ v: 'dup', l: 'Duplicate' }, p2.status === 'archived' ? { v: 'restore', l: 'Restore to draft' } : { v: 'archive', l: 'Archive' });
        var wrap = m.parentNode; wrap.classList.add('pop-wrap'); wrap.style.position = 'relative';
        A.menu(wrap, items, null, async function (v) {
          if (v === 'edit') location.href = 'product.html?id=' + encodeURIComponent(p2.id);
          else if (v === 'view') window.open('../my-product-detail-screen.html?p=' + encodeURIComponent(p2.id) + '&preview=1', '_blank');
          else if (v === 'dup') duplicate(p2);
          else if (v === 'archive' || v === 'restore') { if (await setStatus(p2, v === 'archive' ? 'archived' : 'draft')) { draw(); A.toast(v === 'archive' ? 'Archived ' + p2.name : p2.name + ' restored to draft'); } }
        });
        var pop = wrap.querySelector('.pop'); if (pop) pop.classList.add('right');
        return;
      }
      var r = e.target.closest('[data-id]'); if (r) location.href = 'product.html?id=' + encodeURIComponent(r.getAttribute('data-id'));
    });
    draw();
  }
});
</script>
</body>
</html>
